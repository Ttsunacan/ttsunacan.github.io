<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpotMemo</title><style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1f2a28;--sub:#5d6966;--accent:#2b8f80;--line:#e3e1da}
@media (prefers-color-scheme:dark){:root{--bg:#141a19;--card:#1d2523;--fg:#e8ecea;--sub:#a3b0ac;--accent:#5cc2b2;--line:#2c3533}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 20px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.icon{width:44px;height:44px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700}

<body><main><header><div class="icon">S</div><h1>SpotMemo</h1></header>

<p>やることを“場所”に結びつけて、着いたときに思い出せるメモ・TODOアプリです。</p>
<section><h2>できること</h2><ul>
<li>スーパー・会社などの場所ごとにTODOやメモを登録</li>
<li>いまいる場所のTODOだけを表示</li>
<li>着いたら「ここにはTODOが3件あります」と通知</li>
<li>「◯◯に行く」は着いた時点で自動で完了</li>
<li>Siri・ショートカット・ウィジェットに対応</li></ul></section>

<nav><a href="index.html">SpotMemo</a><a href="support.html">サポート</a><a href="privacy.html">プライバシーポリシー</a></nav>
